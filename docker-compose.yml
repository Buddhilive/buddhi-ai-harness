services:
  # ── BuddhiAI Studio (Local Inferencing & SearXNG Search Service) ──
  buddhi-ai-studio:
    image: ghcr.io/buddhilive/buddhi-ai-studio:latest
    container_name: buddhi-ai-studio
    ports:
      - "8765:8765"
    environment:
      - PORT=8765
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── BuddhiAI Harness (Agent Orchestration & Web UI) ──
  buddhi-ai-harness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buddhi-ai-harness
    ports:
      - "3000:3000"
    environment:
      - BUDDHI_STUDIO_URL=http://buddhi-ai-studio:8765
      - PORT=3000
      - HOST=0.0.0.0
    depends_on:
      buddhi-ai-studio:
        condition: service_started
    volumes:
      - bah-data:/root/.dsh
    restart: unless-stopped

volumes:
  bah-data:
    name: buddhi-ai-harness-data
